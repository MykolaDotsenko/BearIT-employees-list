name: Temporary final visual identity review

on:
  push:
    branches:
      - audit/final-visual-identity

permissions:
  contents: write

jobs:
  review:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/pl.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/people-lens/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pl.log
          exit 1
      - name: Capture visual states
        run: |
          mkdir -p docs/review
          node --input-type=module <<'EOF'
          import { chromium } from "@playwright/test";
          const browser = await chromium.launch({ headless: true });

          const desktop = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
          await desktop.goto("http://127.0.0.1:4173/people-lens/", { waitUntil: "networkidle" });
          await desktop.waitForTimeout(900);
          await desktop.screenshot({ path: "docs/review/home-desktop.png", fullPage: false });

          await desktop.locator(".person-card").first().getByRole("button", { name: /Actions for/ }).click();
          await desktop.waitForTimeout(150);
          await desktop.screenshot({ path: "docs/review/menu-desktop.png", fullPage: false });

          await desktop.getByRole("button", { name: "Add person" }).click();
          await desktop.waitForTimeout(150);
          await desktop.screenshot({ path: "docs/review/add-desktop.png", fullPage: false });

          const mobile = await browser.newPage({ viewport: { width: 390, height: 844 } });
          await mobile.goto("http://127.0.0.1:4173/people-lens/", { waitUntil: "networkidle" });
          await mobile.waitForTimeout(900);
          await mobile.screenshot({ path: "docs/review/home-mobile.png", fullPage: false });

          await mobile.getByRole("button", { name: "Add person" }).click();
          await mobile.waitForTimeout(150);
          await mobile.screenshot({ path: "docs/review/add-mobile.png", fullPage: false });

          await browser.close();
          EOF
          for f in docs/review/*.png; do
            base64 -w 0 "$f" > "$f.b64"
          done
      - name: Commit review captures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/review
          if git diff --cached --quiet; then
            echo "No review changes"
            exit 0
          fi
          git commit -m "chore: capture final visual identity review"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
