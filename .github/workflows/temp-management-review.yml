name: Temporary people-management visual review

on:
  push:
    branches:
      - feature/company-people-management

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/pl.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/people-lens/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pl.log
          exit 1
      - name: Capture management UI
        run: |
          mkdir -p review
          node --input-type=module <<'EOF'
          import { chromium } from "@playwright/test";
          const browser = await chromium.launch({ headless: true });

          const desktop = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
          await desktop.goto("http://127.0.0.1:4173/people-lens/", { waitUntil: "networkidle" });
          await desktop.locator(".brand-add").click();
          await desktop.waitForTimeout(300);
          await desktop.screenshot({ path: "review/desktop-add-person.png", fullPage: false });

          const mobile = await browser.newPage({ viewport: { width: 390, height: 844 } });
          await mobile.goto("http://127.0.0.1:4173/people-lens/", { waitUntil: "networkidle" });
          await mobile.locator(".brand-add").click();
          await mobile.waitForTimeout(300);
          await mobile.screenshot({ path: "review/mobile-add-person.png", fullPage: false });

          await browser.close();
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: people-management-review
          path: review
          retention-days: 1
