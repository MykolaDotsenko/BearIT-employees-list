name: Preview PeopleLens design

on:
  push:
    branches:
      - design/people-lens-human-signal-board
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify and build
        run: npm run check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/people-lens-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/people-lens/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/people-lens-preview.log
          exit 1

      - name: Capture desktop screenshot
        run: |
          mkdir -p docs/screenshots
          node --input-type=module <<'EOF'
          import { chromium } from "@playwright/test";
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({
            viewport: { width: 1440, height: 1050 },
            deviceScaleFactor: 1,
          });
          await page.goto("http://127.0.0.1:4173/people-lens/", { waitUntil: "networkidle" });
          await page.screenshot({
            path: "docs/screenshots/people-lens-home.png",
            fullPage: false,
          });
          await browser.close();
          EOF
          base64 -w 0 docs/screenshots/people-lens-home.png > docs/screenshots/people-lens-home.b64

      - name: Commit preview assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/people-lens-home.png docs/screenshots/people-lens-home.b64
          if git diff --cached --quiet; then
            echo "Preview unchanged"
          else
            git commit -m "docs: refresh PeopleLens design preview"
            git push origin HEAD:${{ github.ref_name }}
          fi
