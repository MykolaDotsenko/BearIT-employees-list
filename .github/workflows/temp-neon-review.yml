name: Temporary neon design review

on:
  push:
    branches:
      - design/neon-3d-people-lens

permissions:
  contents: write

jobs:
  review:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/pl.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/people-lens/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pl.log
          exit 1
      - name: Capture previews
        run: |
          mkdir -p review
          node --input-type=module <<'EOF'
          import { chromium } from "@playwright/test";
          const browser = await chromium.launch({ headless: true });

          const desktop = await browser.newPage({
            viewport: { width: 1440, height: 1050 },
            deviceScaleFactor: 1,
          });
          await desktop.goto("http://127.0.0.1:4173/people-lens/", { waitUntil: "networkidle" });
          await desktop.waitForTimeout(1400);
          await desktop.screenshot({ path: "review/desktop.png", fullPage: false });

          const mobile = await browser.newPage({
            viewport: { width: 390, height: 844 },
            deviceScaleFactor: 1,
          });
          await mobile.goto("http://127.0.0.1:4173/people-lens/", { waitUntil: "networkidle" });
          await mobile.waitForTimeout(1400);
          await mobile.screenshot({ path: "review/mobile.png", fullPage: false });

          await browser.close();
          EOF
      - name: Refresh README screenshot
        run: |
          cp review/desktop.png docs/screenshots/people-lens-home.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/people-lens-home.png
          if git diff --cached --quiet; then
            echo "README screenshot unchanged"
            exit 0
          fi
          git commit -m "docs: refresh PeopleLens neon preview"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
