name: Capture PeopleLens README screenshot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/capture-readme.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/people-lens-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/people-lens-preview.log
          exit 1
      - name: Capture current UI
        run: |
          mkdir -p docs/screenshots
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright'
          const browser = await chromium.launch({ headless: true })
          const page = await browser.newPage({ viewport: { width: 1440, height: 1050 } })
          await page.emulateMedia({ reducedMotion: 'reduce', colorScheme: 'dark' })
          await page.goto('http://127.0.0.1:4173/people-lens/', { waitUntil: 'networkidle' }).catch(async () => {
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' })
          })
          await page.screenshot({
            path: 'docs/screenshots/people-lens-home.png',
            fullPage: true,
          })
          await browser.close()
          NODE
      - name: Commit screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/people-lens-home.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: refresh PeopleLens staffing screenshot"
          git push
